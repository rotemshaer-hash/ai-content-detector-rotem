[build]
  publish = "."
  command = "npm install"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."fetch-video"]
  # Kept because it is the configuration observed working, NOT because it was
  # the cure for the 404s. That theory is dead: hive-detect answered with a
  # 404 HTML page in the same window, and nothing here ever applied to it —
  # so the functions layer was unavailable site-wide for a period rather than
  # this one function failing to bundle. nft costs nothing (it copies the
  # traced files instead of rewriting them into one output), so it stays, but
  # it explains nothing.
  node_bundler = "nft"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
