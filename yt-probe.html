<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>בדיקת יוטיוב — כלי אבחון</title>
<style>
  :root{
    --bg:#eef3f5; --panel:#fff; --panel2:#f4f7f9; --border:#dde5ea;
    --text:#12222b; --muted:#5d7480; --accent:#0d8f82; --bad:#c93a4d; --warn:#b4791a;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    padding:18px 14px 60px;line-height:1.6;}
  .wrap{max-width:720px;margin:0 auto;}
  h1{font-size:21px;margin:0 0 4px;}
  .lede{color:var(--muted);font-size:14px;margin:0 0 16px;}
  .row{display:flex;gap:8px;margin-bottom:14px;}
  input[type=text]{flex:1;min-width:0;background:var(--panel);border:1px solid var(--border);
    color:var(--text);border-radius:10px;padding:12px;font-size:15px;}
  button{background:linear-gradient(180deg,var(--accent),#0a6f65);color:#fff;border:none;
    border-radius:10px;padding:12px 18px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;}
  button:disabled{opacity:.6;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:11px 13px;margin-bottom:8px;}
  .card h2{font-size:14.5px;margin:0;display:flex;align-items:center;gap:8px;}
  .tag{font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;flex-shrink:0;}
  .ok{background:rgba(13,143,130,.14);color:var(--accent);}
  .no{background:rgba(201,58,77,.12);color:var(--bad);}
  .maybe{background:rgba(180,121,26,.14);color:var(--warn);}
  .card p{margin:4px 0 0;font-size:12.5px;color:var(--muted);word-break:break-word;}
  .card code{background:var(--panel2);padding:1px 5px;border-radius:5px;font-size:11.5px;}
  .stage{font-size:12px;font-weight:800;color:var(--muted);margin:16px 0 8px;
    text-transform:none;letter-spacing:0;}
  .verdict{background:var(--panel);border:2px solid var(--accent);border-radius:12px;
    padding:14px;margin-top:16px;font-size:15px;display:none;}
  .verdict.show{display:block;}
  .verdict b{display:block;font-size:16px;margin-bottom:6px;}
  .hint{color:var(--muted);font-size:12.5px;margin-top:14px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>בדיקת יוטיוב — סבב 2</h1>
  <p class="lede">
    הפנייה הישירה ליוטיוב נחסמה ב-CORS — זה נסגר. הסבב הזה בודק <b>שרתי ביניים ציבוריים</b>
    (Piped ו-Invidious), פרויקטים חופשיים שנבנו כדי לגשת ליוטיוב ומרשים לדפדפן לקרוא מהם.
    הכל רץ אצלכם; שום דבר לא נשלח אלינו.
  </p>

  <div class="row">
    <input type="text" id="url" value="https://www.youtube.com/watch?v=dQw4w9WgXcQ">
    <button id="go">בדוק</button>
  </div>

  <div id="out"></div>
  <div class="verdict" id="verdict"></div>

  <p class="hint">צלמו ושלחו — גם "הכל חסום" זו תשובה שמכריעה את ההמשך.</p>
</div>

<script>
(function(){
  var out=document.getElementById('out');
  var verdict=document.getElementById('verdict');
  var goBtn=document.getElementById('go');

  function esc(s){return String(s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function stage(t){var d=document.createElement('div');d.className='stage';d.textContent=t;out.appendChild(d);}
  function card(title,state,detail){
    var tag=state==='ok'?'עובד':state==='no'?'חסום':'חלקי';
    var d=document.createElement('div');
    d.className='card';
    d.innerHTML='<h2><span class="tag '+state+'">'+tag+'</span>'+esc(title)+'</h2><p>'+detail+'</p>';
    out.appendChild(d);
  }

  function videoId(raw){
    try{
      var u=new URL(raw);
      var h=u.hostname.replace(/^www\./,'').replace(/^m\./,'');
      if(h==='youtu.be') return u.pathname.split('/').filter(Boolean)[0]||null;
      var v=u.searchParams.get('v'); if(v) return v;
      var m=u.pathname.match(/\/(?:shorts|embed|live|v)\/([^/?#]+)/);
      return m?m[1]:null;
    }catch(e){ return null; }
  }

  function withTimeout(promise,ms){
    return new Promise(function(res,rej){
      var done=false;
      var t=setTimeout(function(){ if(!done){done=true;rej(new Error('timeout '+ms+'ms'));} },ms);
      promise.then(function(v){ if(!done){done=true;clearTimeout(t);res(v);} },
                   function(e){ if(!done){done=true;clearTimeout(t);rej(e);} });
    });
  }

  // Each source returns {url, label} for a single muxed (video+audio) stream,
  // which is the only kind usable without stitching tracks together.
  var SOURCES=[
    {name:'Piped · kavin.rocks',   api:function(id){return 'https://pipedapi.kavin.rocks/streams/'+id;},      pick:pickPiped},
    {name:'Piped · adminforge.de', api:function(id){return 'https://pipedapi.adminforge.de/streams/'+id;},    pick:pickPiped},
    {name:'Piped · private.coffee',api:function(id){return 'https://api.piped.private.coffee/streams/'+id;},  pick:pickPiped},
    {name:'Invidious · nadeko',    api:function(id){return 'https://inv.nadeko.net/api/v1/videos/'+id;},      pick:pickInv},
    {name:'Invidious · nerdvpn',   api:function(id){return 'https://invidious.nerdvpn.de/api/v1/videos/'+id;},pick:pickInv},
    {name:'Invidious · yewtu.be',  api:function(id){return 'https://yewtu.be/api/v1/videos/'+id;},            pick:pickInv}
  ];

  function pickPiped(j){
    var s=(j&&j.videoStreams)||[];
    var muxed=s.filter(function(x){return x.url && x.videoOnly===false;});
    if(!muxed.length) return null;
    muxed.sort(function(a,b){return (a.width||9999)-(b.width||9999);});
    return {url:muxed[0].url, label:(muxed[0].quality||'')+' '+(muxed[0].format||'')};
  }
  function pickInv(j){
    var s=(j&&j.formatStreams)||[];
    var withUrl=s.filter(function(x){return x.url;});
    if(!withUrl.length) return null;
    return {url:withUrl[0].url, label:(withUrl[0].qualityLabel||'')+' '+(withUrl[0].container||'')};
  }

  function run(){
    out.innerHTML=''; verdict.className='verdict'; verdict.innerHTML='';
    goBtn.disabled=true; goBtn.textContent='בודק...';

    var id=videoId(document.getElementById('url').value.trim());
    if(!id){
      card('זיהוי הקישור','no','לא הצלחתי לחלץ מזהה סרטון מהכתובת.');
      goBtn.disabled=false; goBtn.textContent='בדוק'; return;
    }
    card('זיהוי הקישור','ok','מזהה הסרטון: <code>'+esc(id)+'</code>');

    var found=null, foundFrom='';
    var chain=Promise.resolve();

    stage('שלב 1 — האם הדפדפן מצליח לקבל כתובת וידאו?');
    SOURCES.forEach(function(src){
      chain=chain.then(function(){
        if(found) return; // first working source is enough
        return withTimeout(fetch(src.api(id),{headers:{'Accept':'application/json'}}),12000)
          .then(function(r){
            return r.text().then(function(t){
              var j=null; try{ j=JSON.parse(t); }catch(e){}
              if(!r.ok){ card(src.name,'no','HTTP '+r.status+' '+esc(t.slice(0,70))); return; }
              var got=j?src.pick(j):null;
              if(got&&got.url){
                found=got; foundFrom=src.name;
                card(src.name,'ok','התקבלה כתובת וידאו ('+esc(got.label.trim()||'לא ידוע')+'). הדפדפן <b>כן</b> הצליח לקרוא מהשרת הזה.');
              }else{
                card(src.name,'maybe','השרת ענה, אבל בלי כתובת וידאו שמישה'+(j&&j.error?': '+esc(String(j.error).slice(0,70)):'')+'.');
              }
            });
          })
          .catch(function(e){
            card(src.name,'no','לא נגיש מהדפדפן: <code>'+esc((e&&e.message)||e)+'</code>');
          });
      });
    });

    chain=chain.then(function(){
      stage('שלב 2 — האם אפשר באמת למשוך את בייטים של הסרטון?');
      if(!found){
        card('משיכת הקובץ','no','לא הגענו לשלב הזה — אף שרת לא החזיר כתובת.');
        return;
      }
      return withTimeout(fetch(found.url,{headers:{Range:'bytes=0-4095'}}),20000)
        .then(function(r){
          return r.arrayBuffer().then(function(buf){
            var b=new Uint8Array(buf);
            var sig='';
            for(var i=4;i<8&&i<b.length;i++) sig+=String.fromCharCode(b[i]);
            var isMp4=(sig==='ftyp');
            var isWebm=b.length>4&&b[0]===0x1A&&b[1]===0x45&&b[2]===0xDF&&b[3]===0xA3;
            if(r.ok&&(isMp4||isWebm)){
              card('משיכת הקובץ מ-'+foundFrom,'ok',
                'ירדו '+b.length+' בייטים והם קובץ וידאו תקין ('+(isMp4?'MP4':'WebM')+'). <b>הדרך פתוחה.</b>');
            }else if(r.ok){
              card('משיכת הקובץ מ-'+foundFrom,'maybe',
                'HTTP '+r.status+', ירדו '+b.length+' בייטים אבל הם לא נראים כמו וידאו.');
            }else{
              card('משיכת הקובץ מ-'+foundFrom,'no','HTTP '+r.status+'.');
            }
          });
        })
        .catch(function(e){
          card('משיכת הקובץ מ-'+foundFrom,'no','הדפדפן חסם את ההורדה: <code>'+esc((e&&e.message)||e)+'</code>');
        });
    });

    chain.then(function(){
      var cards=out.querySelectorAll('.card');
      var last=cards[cards.length-1];
      var lastOk=last&&last.querySelector('.tag.ok');
      verdict.className='verdict show';
      if(lastOk){
        verdict.innerHTML='<b>הדרך פתוחה ✅</b>הדפדפן שלכם קיבל כתובת וידאו <b>וגם</b> הצליח למשוך אותה. '+
          'אפשר לבנות תמיכה ביוטיוב שרצה כולה במכשיר — בלי שרת ובלי חשבון.';
      }else if(found){
        verdict.innerHTML='<b>חצי הדרך ⚠️</b>קיבלנו כתובת וידאו, אבל הדפדפן לא הצליח למשוך את הקובץ ממנה. '+
          'צריך לתקוף את הצוואר הזה בלבד.';
      }else{
        verdict.innerHTML='<b>חסום ❌</b>אף שרת ביניים לא נגיש מהדפדפן שלכם. '+
          'הכיוון הזה סגור — נעבור לדרך הקוקיז מחשבון ייעודי.';
      }
      goBtn.disabled=false; goBtn.textContent='בדוק שוב';
    });
  }

  goBtn.onclick=run;
})();
</script>
</body>
</html>
