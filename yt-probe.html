<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>סריקת שרתים — כלי אבחון</title>
<style>
  :root{
    --bg:#eef3f5; --panel:#fff; --panel2:#f4f7f9; --border:#dde5ea;
    --text:#12222b; --muted:#5d7480; --accent:#0d8f82; --bad:#c93a4d; --warn:#b4791a;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    padding:18px 14px 60px;line-height:1.6;}
  .wrap{max-width:720px;margin:0 auto;}
  h1{font-size:21px;margin:0 0 4px;}
  .lede{color:var(--muted);font-size:14px;margin:0 0 16px;}
  .row{display:flex;gap:8px;margin-bottom:14px;}
  input[type=text]{flex:1;min-width:0;background:var(--panel);border:1px solid var(--border);
    color:var(--text);border-radius:10px;padding:12px;font-size:15px;}
  button{background:linear-gradient(180deg,var(--accent),#0a6f65);color:#fff;border:none;
    border-radius:10px;padding:12px 18px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;}
  button:disabled{opacity:.6;}
  .summary{background:var(--panel);border:2px solid var(--accent);border-radius:12px;
    padding:12px 14px;margin-bottom:12px;font-size:15px;display:none;}
  .summary.show{display:block;}
  .summary b{font-size:16px;}
  .list{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  .item{display:flex;align-items:center;gap:9px;padding:9px 12px;border-bottom:1px solid var(--border);
    font-size:13.5px;}
  .item:last-child{border-bottom:none;}
  .tag{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:99px;flex-shrink:0;min-width:52px;text-align:center;}
  .ok{background:rgba(13,143,130,.14);color:var(--accent);}
  .no{background:rgba(201,58,77,.10);color:var(--bad);}
  .maybe{background:rgba(180,121,26,.14);color:var(--warn);}
  .who{font-weight:700;}
  .why{color:var(--muted);font-size:12px;}
  .stage{font-size:12.5px;font-weight:800;color:var(--muted);margin:16px 0 8px;}
  .hint{color:var(--muted);font-size:12.5px;margin-top:14px;}
  .copybox{width:100%;margin-top:10px;background:var(--panel2);border:1px solid var(--border);
    border-radius:8px;padding:8px;font-size:11.5px;color:var(--muted);min-height:60px;font-family:monospace;}
</style>
</head>
<body>
<div class="wrap">
  <h1>סריקת שרתים</h1>
  <p class="lede">
    יוטיוב כבר עובד — אבל מתוך 12 שרתים רק 2 נגישים מהרשת שלכם, ושניהם נחסמו.
    הסריקה הזו בודקת <b>רשימה גדולה</b> ומוצאת אילו שרתים באמת פתוחים אצלכם,
    כדי שנכניס אותם לאפליקציה. הכל רץ אצלכם.
  </p>

  <div class="row">
    <input type="text" id="url" value="https://www.youtube.com/watch?v=dQw4w9WgXcQ">
    <button id="go">סרוק</button>
  </div>

  <div class="summary" id="summary"></div>
  <div id="out"></div>

  <p class="hint">צלמו את הסיכום למעלה ואת השורות הירוקות — זה כל מה שאני צריך.</p>
</div>

<script>
(function(){
  var out=document.getElementById('out');
  var summary=document.getElementById('summary');
  var goBtn=document.getElementById('go');

  function esc(s){return String(s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

  function videoId(raw){
    try{
      var u=new URL(raw);
      var h=u.hostname.replace(/^www\./,'').replace(/^m\./,'');
      if(h==='youtu.be') return u.pathname.split('/').filter(Boolean)[0]||null;
      var v=u.searchParams.get('v'); if(v) return v;
      var m=u.pathname.match(/\/(?:shorts|embed|live|v)\/([^/?#]+)/);
      return m?m[1]:null;
    }catch(e){ return null; }
  }

  function withTimeout(pr,ms){
    return new Promise(function(res,rej){
      var done=false;
      var t=setTimeout(function(){ if(!done){done=true;rej(new Error('timeout'));} },ms);
      pr.then(function(v){ if(!done){done=true;clearTimeout(t);res(v);} },
              function(e){ if(!done){done=true;clearTimeout(t);rej(e);} });
    });
  }

  var PIPED=[
    'https://api.piped.private.coffee','https://pipedapi.kavin.rocks','https://pipedapi.adminforge.de',
    'https://pipedapi.drgns.space','https://pipedapi.ducks.party','https://pipedapi.r4fo.com',
    'https://pipedapi.leptons.xyz','https://pipedapi.reallyaweso.me','https://api.piped.yt',
    'https://pipedapi.smnz.de','https://pipedapi.nosebs.ru','https://pipedapi.astartes.nl',
    'https://pipedapi.osphost.fi','https://piped-api.lunar.icu','https://api.piped.projectsegfau.lt',
    'https://pipedapi.phoenixthrush.com','https://pipedapi.darkness.services'
  ];
  var INVIDIOUS=[
    'https://inv.nadeko.net','https://invidious.nerdvpn.de','https://yewtu.be',
    'https://invidious.privacyredirect.com','https://iv.melmac.space','https://inv.tux.pizza',
    'https://invidious.jing.rocks','https://invidious.f5.si','https://inv.us.projectsegfau.lt',
    'https://invidious.reallyaweso.me','https://iv.datura.network','https://invidious.einfachzocken.eu'
  ];

  function shortName(base){
    try{ return new URL(base).hostname; }catch(e){ return base; }
  }

  function item(state,who,why){
    var tag=state==='ok'?'פתוח':state==='no'?'סגור':'חסום';
    var d=document.createElement('div');
    d.className='item';
    d.innerHTML='<span class="tag '+state+'">'+tag+'</span>'+
                '<span class="who">'+esc(who)+'</span>'+
                (why?'<span class="why">'+esc(why)+'</span>':'');
    return d;
  }

  function probeOne(base,type,id){
    var url=(type==='piped')
      ? base+'/streams/'+encodeURIComponent(id)
      : base+'/api/v1/videos/'+encodeURIComponent(id);
    return withTimeout(fetch(url,{headers:{'Accept':'application/json'}}),9000)
      .then(function(r){
        return r.text().then(function(t){
          var j=null; try{ j=JSON.parse(t); }catch(e){}
          if(!r.ok){
            var why=(j&&(j.error||j.message))||t.slice(0,50);
            var botBlocked=/NotBot|LOGIN_REQUIRED|not a bot/i.test(String(why));
            return {state:botBlocked?'maybe':'no', base:base, type:type,
                    why:botBlocked?'יוטיוב חסמה את השרת':(r.status+' '+String(why).split('\n')[0].slice(0,40))};
          }
          var streams=(type==='piped')?((j&&j.videoStreams)||[]):((j&&j.formatStreams)||[]);
          var usable=streams.filter(function(x){
            return x&&x.url&&!/lbry|hls|m3u8/i.test(String(x.quality||'')+String(x.format||'')+String(x.container||''));
          });
          if(type==='invidious'&&j) usable=usable.concat([1]); // its own /latest_version endpoint always exists
          if(!usable.length) return {state:'no', base:base, type:type, why:'בלי עותק שמיש'};
          return {state:'ok', base:base, type:type, why:usable.length+' עותקים'};
        });
      })
      .catch(function(e){
        return {state:'no', base:base, type:type,
                why:(e&&e.message==='timeout')?'לא הגיב בזמן':'לא נגיש'};
      });
  }

  function run(){
    out.innerHTML=''; summary.className='summary'; summary.innerHTML='';
    goBtn.disabled=true; goBtn.textContent='סורק...';

    var id=videoId(document.getElementById('url').value.trim());
    if(!id){
      out.innerHTML='<div class="list"><div class="item"><span class="tag no">שגיאה</span>לא זוהה מזהה סרטון</div></div>';
      goBtn.disabled=false; goBtn.textContent='סרוק'; return;
    }

    var all=PIPED.map(function(b){return {base:b,type:'piped'};})
      .concat(INVIDIOUS.map(function(b){return {base:b,type:'invidious'};}));

    // A live directory would make the app self-maintaining instead of carrying
    // a list that rots — worth knowing whether the browser can even read one.
    var dirCheck=withTimeout(fetch('https://piped-instances.kavin.rocks/'),9000)
      .then(function(r){ return r.ok?r.json():null; })
      .then(function(j){ return Array.isArray(j)?j.length:null; })
      .catch(function(){ return null; });

    Promise.all(all.map(function(s){ return probeOne(s.base,s.type,id); }))
      .then(function(results){
        return dirCheck.then(function(dirCount){
          var open=results.filter(function(r){return r.state==='ok';});
          var blocked=results.filter(function(r){return r.state==='maybe';});

          summary.className='summary show';
          summary.innerHTML='<b>'+open.length+' שרתים פתוחים ועובדים</b> מתוך '+results.length+
            ' · '+blocked.length+' נגישים אבל חסומים ע"י יוטיוב'+
            '<div class="why" style="margin-top:6px;">רשימה חיה של שרתים: '+
            (dirCount?('נגישה ('+dirCount+' שרתים) — אפשר לעדכן את האפליקציה אוטומטית'):'לא נגישה מהדפדפן')+
            '</div>'+
            (open.length?('<textarea class="copybox" readonly>'+
              esc(open.map(function(r){return r.base;}).join('\n'))+'</textarea>'):'');

          var order={ok:0,maybe:1,no:2};
          results.sort(function(a,b){
            return (order[a.state]-order[b.state]) || shortName(a.base).localeCompare(shortName(b.base));
          });

          var stage=document.createElement('div');
          stage.className='stage'; stage.textContent='כל השרתים שנבדקו';
          out.appendChild(stage);
          var list=document.createElement('div'); list.className='list';
          results.forEach(function(r){ list.appendChild(item(r.state,shortName(r.base),r.why)); });
          out.appendChild(list);

          goBtn.disabled=false; goBtn.textContent='סרוק שוב';
        });
      });
  }

  goBtn.onclick=run;
})();
</script>
</body>
</html>
